<!DOCTYPE html>
<html>
<head>
    <title>YouTube RAG</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h2>YouTube RAG</h2>

        <div id="videoInfo">
            Detecting video...
        </div>

        <button id="processBtn">
            Process Video
        </button>

        <div id="status"></div>

        <textarea
            id="question"
            placeholder="Ask something about this video..."
        ></textarea>

        <button id="askBtn">
            Ask
        </button>

        <div id="answer"></div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
